name: Deploy Origin Lens models to Hugging Face

# Pushes spaces/origin-lens-models to a Hugging Face Space whenever it changes.
# Setup (once): repo Settings > Secrets and variables > Actions
#   Secret   HF_TOKEN     a Hugging Face access token with write access
#   Variable HF_SPACE_ID  the Space to deploy to, e.g. your-name/origin-lens-models
on:
  push:
    branches: [main]
    paths: ["spaces/origin-lens-models/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub>=0.25"
      - name: Upload the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE_ID"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(folder_path="spaces/origin-lens-models", repo_id=space,
                            repo_type="space", commit_message="Sync from GitHub world-of-ai")
          host = space.replace("/", "-").replace("_", "-").replace(".", "-").lower()
          print(f"Deployed. API: https://{host}.hf.space")
          EOF
